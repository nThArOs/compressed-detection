name: compressed-detection
image: compressed-detection-track:cpu
task: detection-tracking
shm_size: 2g

# Files a model depends on besides its weights: residual computation and codec settings. The platform pins
# them with each trained version and mounts them back for its evaluations, benchmarks and service.
preprocessing: [configs/residual.yaml, configs/compressed.yaml]

datasets:
  - name: dut_anti_uav_mot
    mount: data/mot/dut_anti_uav
  - name: dut_anti_uav_yolo
    mount: data/yolo/dut_anti_uav
  - name: uavdt_yolo
    mount: data/yolo/uavdt
  - name: visdrone_yolo
    mount: data/yolo/visdrone_mot

models:
  residual:
    description: Detector on motion-compensated residuals, decoded from the compressed stream
    vars: { input: residual }
  rgb:
    description: Detector on fully decoded RGB frames, the baseline
    vars: { input: rgb }

entrypoints:
  train:
    command: python scripts/train_yolo.py dut_anti_uav {input} --config {config} --tag platform
    config: configs/train.yaml
    outputs: { model: "models/dut_anti_uav_{input}_platform.pt", metrics: "results/detect_dut_anti_uav_{input}_platform.json" }
  evaluate:
    command: >-
      python scripts/track.py platform_{input} dut_anti_uav --input {input} --model {model} --classes drone --config {config}
      --sequences data/yolo/dut_anti_uav/splits.json
      && python scripts/eval_mot.py platform_{input} dut_anti_uav --sequences data/yolo/dut_anti_uav/splits.json
    config: configs/track.yaml
    outputs: { metrics: "results/metrics_dut_anti_uav_test_platform_{input}_heldout.json" }
  benchmark:
    command: python scripts/benchmark.py --model {model} --input {input}
    outputs: { metrics: "results/bench_dut_anti_uav_{input}_platform.json" }
  export:
    command: python scripts/export.py --model {model} --input {input} --format {format}
    outputs: { model: "models/export_dut_anti_uav_{input}.onnx", metrics: "results/export_dut_anti_uav_{input}.json" }
  serve:
    command: >-
      python scripts/serve.py --model {model} --port {port} --input {input} --classes drone
      --source data/mot/dut_anti_uav/test/video01/video.mp4,data/mot/dut_anti_uav/test/video12/video.mp4,data/mot/dut_anti_uav/test/video18/video.mp4
    port: 8000

metrics:
  primary: mean.HOTA
  higher_is_better: true
  watch: [mean.HOTA, mean.F1, mean.Precision, mean.Recall, mean.IDF1, fps]

promotion:
  min_gain: 0
  no_regression: { mean.F1: higher, operational.false_alarms_per_hour: lower }
  tolerance: 0.02

# Target: an edge box with 2 CPU cores and 2 GB of RAM, at least about 2 frames per second
constraints:
  edge-small: { latency_p95_ms: 600, ram_mb: 1500, model_mb: 20 }

# A new version of the YOLO dataset queues a training of the residual model, evaluated on the held-out
# videos and benchmarked on edge-small. Promotion stays a human decision.
retrain:
  - model: residual
    datasets: [dut_anti_uav_yolo]
    config: configs/train.yaml
    eval_datasets: [dut_anti_uav_mot, dut_anti_uav_yolo]
    benchmark_profiles: [edge-small]
    promote: manual
