output_dir: results/tracking

baseline:
  tracker: bytetrack.yaml   # Ultralytics default: high 0.25, low 0.1, buffer 30
  conf: 0.1                 # must be <= the tracker low threshold
  imgsz: 640

eval:
  ignore_ioa: 0.5           # tracker boxes this much inside an ignore region are dropped
  size_edges: [40, 80]      # object size buckets, sqrt(w * h) in pixels; DUT drones: median 56 px
  thresholds: [0.1, 0.95, 0.05]   # confidence thresholds for the precision / recall curve (start, stop, step)
  bootstrap: 1000           # resamples of the sequences for the 95 % intervals

datasets:
  dut_anti_uav:
    splits: [test]
    model: models/drone_yolo11n.pt
    class_map: {0: drone}
    eval_classes: [drone]
  uavdt:
    splits: [test]
    model: models/yolo11n.pt  # COCO
    class_map: {2: car, 5: bus, 7: truck}
    eval_classes: [car, truck, bus]
  visdrone_mot:
    splits: [test_dev]
    model: models/yolo11n.pt  # COCO, no van class
    class_map: {0: pedestrian, 1: bicycle, 2: car, 3: motor, 5: bus, 7: truck}
    eval_classes: [pedestrian, car, van, truck, bus]   # official VisDrone MOT classes

# Labels used in results/report.html
methods:
  baseline_rgb: RGB, off-the-shelf detector
  residual_yolo: Residual, YOLO11n trained on DUT
  rgb_yolo: RGB, YOLO11n trained on DUT
