services:
  extract:
    build: .
    image: compressed-detection:cpu
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./configs:/app/configs
      - ./scripts:/app/scripts

  track:
    build:
      context: .
      dockerfile: Dockerfile.track
    image: compressed-detection-track:cpu
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./models:/app/models
      - ./runs:/app/runs
    shm_size: "2gb"
