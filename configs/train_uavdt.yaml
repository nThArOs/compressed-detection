# UAVDT training, shortened to fit the CPU budget. Same settings for every modality so RGB and residual models are comparable.
init: models/yolo11n.pt   # starting weights, pretrained on COCO; the file also sets the architecture (yolo11n, yolov8n, ...)
epochs: 12                # passes over the training frames; fewer than the full config to bound the CPU time
imgsz: 640                # input size in pixels; larger helps small drones but is slower
batch: 16                 # frames per optimization step; lower it if memory runs out
patience: 5               # stop early after this many epochs without improvement on validation
workers: 8                # processes that load and augment frames in parallel
cache: ram                # keep decoded frames in memory (about 3.5 GB) instead of reading them every epoch
project: runs/train       # where Ultralytics writes weights, plots and results.csv
